services:
  - type: web
    name: selo-vivo-api
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install uv && uv sync --directory backend --frozen
    preDeployCommand: uv run --directory backend alembic upgrade head
    startCommand: uv run --directory backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: LOG_LEVEL
        value: INFO
