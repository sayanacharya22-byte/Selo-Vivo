services:
  - type: web
    name: selo-vivo-api
    runtime: python
    rootDir: backend
    region: ohio
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: pip install uv==0.11.23 && uv sync --frozen --no-dev
    startCommand: >-
      uv run --no-dev alembic upgrade head &&
      exec uv run --no-dev uvicorn app.main:app
      --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
